<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - CORS Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        input,
        button {
            padding: 10px;
            margin: 5px;
        }

        .todo-item {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>

<body>
    <h1>Todo App (CORS Demo)</h1>

    <div class="div">
        <input type="text" id="todoInput" placeholder="Enter new todo">
        <button onclick="addTodo()">Add Todo</button>
    </div>

    <div id="todoList"></div>

    <script>
        const API_URL = 'http://localhost:4000/api/todos';

        // Fetch all todos
        async function fetchTodos() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.success) {
                    displayTodos(result.data);
                }
            } catch (error) {
                console.error('CORS Error or Network Error:', error);
                alert('Failed to fetch todos. Check if CORS is configured correctly!');
            }
        }

        // Display todos
        function displayTodos(todos) {
            const todoList = document.getElementById('todoList');
            todoList.innerHTML = '';

            todos.forEach(todo => {
                const div = document.createElement('div');
                div.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <span onclick="toggleTodo(${todo.id}, ${!todo.completed})">${todo.title}</span>
                    <button onclick="deleteTodo(${todo.id})">Delete</button>
                `;
                todoList.appendChild(div);
            });
        }

        // Add new todo
        async function addTodo() {
            const input = document.getElementById('todoInput');
            const title = input.value.trim();

            if (!title) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title }),
                });

                const result = await response.json();

                if (result.success) {
                    input.value = '';
                    fetchTodos();
                }
            } catch (error) {
                console.error('Error adding todo:', error);
                alert('Failed to add todo. CORS issue?');
            }
        }

        // Toggle todo completion
        async function toggleTodo(id, completed) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed })
                });

                const result = await response.json();

                if (result.success) {
                    fetchTodos();
                }
            } catch (error) {
                console.error('Error updating todo:', error);
            }
        }

        // Delete todo
        async function deleteTodo(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    fetchTodos();
                }
            } catch (error) {
                console.error('Error deleting todo:', error);
            }
        }

        // Load todos on page load
        fetchTodos();
    </script>
</body>

</html>
